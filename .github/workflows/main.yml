
name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Extract Android Project
        shell: bash
        run: |
          set -e

          if [ -f "./gradlew" ]; then
            echo "PROJECT_DIR=." >> "$GITHUB_ENV"
          else
            mkdir -p .android-project
            unzip -q vakil-office-android-build-kit.zip -d .android-project

            WRAPPER=$(find .android-project -type f -name gradlew -print -quit)

            if [ -z "$WRAPPER" ]; then
              echo "ERROR: gradlew not found in ZIP"
              find .android-project -maxdepth 5 -type f | head -200
              exit 1
            fi

            PROJECT_DIR=$(dirname "$WRAPPER")
            echo "PROJECT_DIR=$PROJECT_DIR" >> "$GITHUB_ENV"
          fi

      - name: Build Android APK
        shell: bash
        run: |
          set -e
          cd "$PROJECT_DIR"
          chmod +x gradlew
          ./gradlew --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: VakilOffice-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
          
